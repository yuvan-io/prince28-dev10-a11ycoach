
[project]
name = "a11ycoach"
version = "0.1.0"
description = "An accessibility mentor that maps UI issues to WCAG criteria and suggests fixes."
readme = "README.md"
authors = [
    { name = "yuvan", email = "yuvansri.it.28@psvpec.in" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "protego>=0.7.0",
    "pydantic-settings>=2.16.3",
    "pymupdf>=1.26,<2",
    "pypdf>=7.1.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "trafilatura>=2.4.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require a real PostgreSQL database",
]
[tool.poe.tasks]
dev = "python -m uvicorn a11ycoach.api.main:create_app --factory --reload"
test = ["test-unit", "test-integration"]
test-unit = "python -m pytest tests -m 'not integration'"
test-integration = "python scripts/test-integration.py"
lint = "ruff check src tests"
format = "ruff format src tests"
worker = "arq a11ycoach.workers.main.WorkerSettings"
